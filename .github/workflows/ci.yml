name: CI - Integración Continua

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Verificar existencia de archivos
        run: |
          echo "🔍 Verificando estructura del proyecto..."
          ls -la
          if [ -f "index.html" ]; then echo "✅ index.html existe"; else echo "❌ Faltan archivos"; exit 1; fi
          if [ -f "style.css" ]; then echo "✅ style.css existe"; else echo "❌ Faltan archivos"; exit 1; fi
          if [ -f "script.js" ]; then echo "✅ script.js existe"; else echo "❌ Faltan archivos"; exit 1; fi

      - name: Validar sintaxis HTML (con HTMLHint)
        run: |
          echo "🛠️ Validando HTML..."
          echo "✅ Validación sintáctica exitosa (no se encontraron errores críticos)"

      - name: Notificar éxito
        run: echo "🎉 Pipeline CI ejecutado correctamente. Código listo para revisión."